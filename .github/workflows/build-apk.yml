name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Shorts_Guardian_Mobile_slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - run: npm install --no-audit --no-fund
      - run: npm run build:www
      - run: npm test
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: Shorts_Guardian_Mobile_slim/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ShortsGuardian-debug-apk
          path: Shorts_Guardian_Mobile_slim/android/app/build/outputs/apk/debug/app-debug.apk
